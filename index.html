.code{font-size:44px;font-weight:900;letter-spacing:6px;color:var(--ac)}

.sheet .ttl{position:absolute;left:40mm;top:6mm;font-size:10mm;font-weight:800}
.sheet .ttl small{display:block;font-size:5mm;font-weight:500}
.sheet .box{position:absolute;left:0;top:36mm;width:277mm;height:153mm;display:flex;align-items:center;justify-content:center}
.sheet .box img{max-width:100%;max-height:100%}
.sheet .tip{position:absolute;right:0;top:22mm;font-size:4mm;width:90mm;text-align:right}
@media print{
 body>*:not(#m){display:none!important}

 .sheet{zoom:1;margin:0;break-after:page}.sheet:last-child{break-after:auto}
 @page{size:A4 landscape;margin:10mm}
}

 for(let i=0;i<16;i++){const a=i*Math.PI/8,k=Math.PI/16*.9;r+=`<polygon points="${p(a-k,78)} ${p(a,142)} ${p(a+k,78)}"/>`}
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${r}<circle cx="150" cy="150" r="66"/><circle cx="150" cy="150" r="46"/><circle cx="128" cy="138" r="6" fill="#000"/><circle cx="172" cy="138" r="6" fill="#000"/><path d="M122 164Q150 192 178 164" fill="none"/></svg>`}

const T={
 yurt:{n:'Юрта',k:'Киіз үй',c:3,img:A.art.yurt},
 baiterek:{n:'Байтерек',k:'Бәйтерек',c:1,img:A.art.baiterek},

 boy:{n:'Мальчик',k:'Ұл бала',c:3,img:A.art.boy},
 girl:{n:'Девочка',k:'Қыз бала',c:3,img:A.art.girl},
 sun:{n:'Солнце',k:'Күн',c:2,img:svgURI(sunSVG())},

function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
let OX=0,OY=0,VW=0,VH=0,U=1;
function size(){dpr=window.devicePixelRatio||1;VW=innerWidth;VH=innerHeight;cv.width=VW*dpr;cv.height=VH*dpr;if(VW/VH>=1.2){W=VW;H=VH;OX=0;OY=0}else{const s=Math.min(VW/16,VH/9);W=16*s;H=9*s;OX=(VW-W)/2;OY=(VH-H)/2}U=Math.min(H,W*9/16)}
addEventListener('resize',size);size();

/* ---------- сцена ---------- */
const YS=[.8,.2,.64,.36],KR=[[.83,0],[.92,.5],[.74,.5],[.78,0]],W0=1920,H0=1080;
function flagSlot(n){const fh=H0*.115,fw=fh*1.15,m=fh*.15,g=fw*1.08,sp=W0-2*m-fw,nt=Math.max(3,Math.floor((W0-2*m)/g)),st=sp/(nt-1),nv=Math.max(0,Math.floor((H0-2*m-2*fh*1.1)/(fh*1.1)));let cx,by;
 if(n<nt){cx=m+fw/2+n*st;by=m+fh}
 else{const k=n-nt;if(k<nv*2){cx=(k%2)?W0-m-fw/2:m+fw/2;by=m+fh+((k/2|0)+1)*fh*1.1}
  else{const j=k-nv*2,q=nt-2;cx=m+fw/2+(1+j%q)*st;by=m+fh+(1+(j/q|0))*fh*1.1}}
 return{x:cx/W0,gy:by/H0}}
function kidSlot(k){const P=9,[gy,off]=KR[Math.floor(k/P)%4],i=k%P,c=i?(i%2?1:-1)*Math.ceil(i/2):0,pitch=.088;return{x:.5+off*pitch+c*pitch,gy}}
function place(type){const n=items.filter(i=>i.type==type).length;
 if(type=='baiterek')return{x:.5+(n?(n%2?1:-1)*.1*Math.ceil(n/2):0),gy:.54};
 if(type=='sun')return{x:n%2?.84:.16,gy:.3+Math.floor(n/2)*.1};
 if(type=='bird')return{x:Math.random(),gy:.1+Math.random()*.18};
 if(type=='yurt')return{x:YS[n%4]+Math.floor(n/4)*.04,gy:.6+(n%2)*.015};
 if(type=='flag')return flagSlot(n);
 return kidSlot(items.filter(i=>i.type=='boy'||i.type=='girl').length)}
function makeDark(s){const d=document.createElement('canvas');d.width=s.width;d.height=s.height;const c=d.getContext('2d');c.drawImage(s,0,0);c.globalCompositeOperation='source-atop';c.fillStyle='rgba(20,30,60,.55)';c.fillRect(0,0,d.width,d.height);return d}
function makeShade(s){const d=document.createElement('canvas');d.width=s.width;d.height=s.height;const c=d.getContext('2d'),g=c.createLinearGradient(0,0,d.width,d.height);g.addColorStop(0,'rgba(255,255,255,.38)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,10,40,.34)');c.fillStyle=g;c.fillRect(0,0,d.width,d.height);c.globalCompositeOperation='destination-in';c.drawImage(s,0,0);return d}
function addItem(type,spr,pos,id,remote){
 if(id&&items.some(i=>i.id==id))return;
 id=id||(Date.now().toString(36)+Math.random().toString(36).slice(2,6));
 pos=pos||place(type);
 const it={id,type,spr,x:pos.x,gy:pos.gy,t0:performance.now()/1000,seed:Math.random()*10};
 it.dark=makeDark(spr);it.shade=makeShade(spr);
 items.push(it);
 for(let i=0;i<26;i++){const a=Math.random()*6.283,v=80+Math.random()*220;ps.push({x:it.x*W,y:it.gy*H-(SZ[type]||.15)*H*.4,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,l:1,c:['#ffc72c','#fff','#00afca','#ff6b6b'][i%4]})}
 if(!remote)bcast(itemMsg(it));
}
function addRemote(d){if(!d||!T[d.type]||typeof d.img!='string'||!d.img.startsWith('data:image/png'))return;
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);addItem(d.type,c,d.pos,String(d.id).slice(0,40),true)};im.src=d.img}
function star(x,y,r,a){ctx.save();ctx.translate(x,y);ctx.globalAlpha=a;ctx.fillStyle='#fff8c8';ctx.beginPath();for(let i=0;i<8;i++){const rr=i%2?r*.25:r;ctx.lineTo(Math.cos(i*Math.PI/4)*rr,Math.sin(i*Math.PI/4)*rr)}ctx.fill();ctx.restore()}
const eob=e=>{const c=1.7;return 1+(c+1)*Math.pow(e-1,3)+c*Math.pow(e-1,2)};
function dims(it){const S=it.spr,a=S.width/S.height;const f=['sun','bird','baiterek','flag','yurt'].includes(it.type)?1:.75+(it.gy-.7)*1.6;let w,h;
 if(it.type=='yurt'){w=Math.min(U*1.778*.17,H*.4);h=w/a}else{h=U*SZ[it.type]*f;w=h*a}return[w,h]}
function drawIt(it,t){
 const [w,h]=dims(it),S=it.spr,e=Math.min(1,(t-it.t0)/.9),sc=Math.max(.001,eob(e)),ty=it.type,tl=Math.sin(t*.9+it.seed),ex=Math.max(1.5,w*.006),ph=t+it.seed;
 const lay=(x0,y0,n)=>{for(let k=n;k>=1;k--)ctx.drawImage(it.dark,x0+k*ex*(.8+.2*tl),y0-k*ex*.35,w,h)};
 const solid=(x0,y0,n)=>{lay(x0,y0,n);ctx.drawImage(S,x0,y0,w,h);ctx.drawImage(it.shade,x0,y0,w,h)};
 ctx.save();
 if(ty=='bird'){
  const sp=.07+it.seed%3*.01,x=((t*sp*W+it.seed*W*.3)%(W+2*w))-w,y=it.gy*H+Math.sin(t*1.4+it.seed)*H*.03;
  ctx.translate(x,y);ctx.rotate(Math.sin(t*1.4+it.seed)*.08);ctx.scale(sc,sc*(.78+.22*Math.sin(t*11+it.seed)));solid(-w/2,-h/2,5);ctx.restore();return}
 if(ty=='sun'){
  const x=it.x*W,y=it.gy*H,pl=1+Math.sin(t*2)*.04;
  ctx.translate(x,y);ctx.scale(sc*pl,sc*pl);
  const g=ctx.createRadialGradient(0,0,h*.2,0,0,h*.9);g.addColorStop(0,'rgba(255,230,120,.7)');g.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,h*.9,0,6.283);ctx.fill();
  ctx.rotate(t*.35);solid(-w/2,-h/2,6);ctx.restore();return}
 ctx.translate(it.x*W,it.gy*H);
 ctx.fillStyle='rgba(20,60,20,.28)';ctx.beginPath();ctx.ellipse(0,0,w*.5*sc,h*.045*sc+2,0,0,6.283);ctx.fill();
 ctx.scale(sc,sc);
 if(ty=='flag'){
  const n=Math.max(8,Math.ceil(w/4)),sw=S.width/n,dw=w/n;
  const strip=(img,i,dy,dx,dyo)=>ctx.drawImage(img,i*sw,0,sw,S.height,-w/2+i*dw+dx,-h+dy+dyo,dw+1,h);
  const arg=i=>3.4*t+it.seed-(i/n)*7,wy=i=>Math.sin(arg(i))*h*.03*Math.max(0,i/n-.1);
  for(let k=3;k>=1;k--)for(let i=0;i<n;i++)strip(it.dark,i,wy(i),k*ex*.9,-k*ex*.35);
  for(let i=0;i<n;i++){strip(S,i,wy(i),0,0);const sl=Math.cos(arg(i));if(sl>0){ctx.globalAlpha=sl*.35;strip(it.dark,i,wy(i),0,0);ctx.globalAlpha=1}}
 }else if(ty=='boy'||ty=='girl'){
  const bob=-Math.abs(Math.sin(ph*3.2))*h*.02,arms=ARMS[ty];
  ctx.translate(0,bob);ctx.transform(1,0,tl*.012,1,0,0);
  solid(-w/2,-h,6);
  arms.forEach((a,i)=>{const px=-w/2+a[4]*w,py=-h+a[5]*h;ctx.save();ctx.translate(px,py);ctx.rotate(Math.sin(ph*5.5+i*Math.PI)*.3);ctx.translate(-px,-py);
   ctx.beginPath();ctx.rect(-w/2+a[0]*w,-h+a[1]*h,(a[2]-a[0])*w,(a[3]-a[1])*h);ctx.clip();ctx.drawImage(S,-w/2,-h,w,h);ctx.restore()});
 }else{
  const br=1+Math.sin(t*1.7)*.006;
  if(ty=='baiterek'){const g=ctx.createRadialGradient(0,-h*.9,5,0,-h*.9,h*.35),a=.3+.2*Math.sin(t*2.2);g.addColorStop(0,`rgba(255,230,120,${a+.2})`);g.addColorStop(1,'rgba(255,230,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-h*.9,h*.35,0,6.283);ctx.fill()}
  ctx.transform(1,0,tl*.012,br,0,0);
  solid(-w/2,-h,7);
  for(let j=0;j<9;j++){const p2=t*.8+j*.7+it.seed,a=Math.max(0,Math.sin(p2));star(-w/2+((j*.37+it.seed)%1)*w,-h*(.1+((j*.23+it.seed*.7)%1)*.8),5+w*.012,a)}
 }
 ctx.restore();
}
function frame(ms){
 const t=ms/1000;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#0b1a2a';ctx.fillRect(0,0,VW,VH);ctx.save();ctx.setTransform(dpr,0,0,dpr,OX*dpr,OY*dpr);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
 if(bg.complete&&bg.naturalWidth){const s=Math.max(W/bg.naturalWidth,H/bg.naturalHeight),w=bg.naturalWidth*s,h=bg.naturalHeight*s;ctx.drawImage(bg,(W-w)/2,H-h,w,h)}else{ctx.fillStyle='#4aa8f0';ctx.fillRect(0,0,W,H)}
 const rank=i=>i.type=='sun'?-1:i.type=='bird'?9:i.type=='flag'?8:i.gy;
 items.slice().sort((a,b)=>rank(a)-rank(b)).forEach(i=>drawIt(i,t));
 const dt=1/60;ps=ps.filter(p=>p.l>0);ps.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.l-=dt*.9;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.283);ctx.fill()});ctx.globalAlpha=1;ctx.restore();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- связь устройств (WebRTC, без аккаунтов) ---------- */
let P=null,conns=[],CLIENT=/#\d{4}/.test(location.hash);
CODE=(location.hash.match(/\d{4}/)||[String(1000+Math.floor(Math.random()*9000))])[0];
const itemMsg=it=>({t:'add',id:it.id,type:it.type,pos:{x:it.x,gy:it.gy},img:it.spr.toDataURL('image/png')});
function bcast(m,ex){conns.forEach(c=>{if(c!==ex&&c.open){try{c.send(m)}catch(e){}}})}
function onMsg(d,c){if(!d)return;if(d.t=='add'){addRemote(d);bcast(d,c)}else if(d.t=='clear'){items=[];cnt={};bcast(d,c)}}
function hook(c){conns.push(c);
 c.on('open',()=>{toast('Устройство подключено ✓');items.forEach((it,i)=>setTimeout(()=>{try{c.send(itemMsg(it))}catch(e){}},i*150))});
 c.on('data',d=>onMsg(d,c));c.on('close',()=>{conns=conns.filter(x=>x!==c);toast('Устройство отключилось')})}
function startNet(){
 if(P){try{P.destroy()}catch(e){}}conns=[];
 try{P=CLIENT?new Peer():new Peer('kzres'+CODE)}catch(e){toast('Связь между устройствами недоступна');return}
 P.on('error',e=>{if(e.type=='unavailable-id'&&!CLIENT){CODE=String(1000+Math.floor(Math.random()*9000));startNet()}else toast('Связь: '+e.type+' (рисунки работают только на этом экране)',5000)});
 if(CLIENT)P.on('open',()=>hook(P.connect('kzres'+CODE,{reliable:true})));else P.on('connection',hook)}

const loadImg=s=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=s});
async function sheetCanvas(k){
 const t=T[k],S=6,c=document.createElement('canvas');c.width=277*S;c.height=189*S;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
 const q=qrcode(0,'L');q.addData('kz:'+k);q.make();
 x.imageSmoothingEnabled=false;x.drawImage(await loadImg(q.createDataURL(8,32)),1.43*S,1.43*S,33.14*S,33.14*S);x.imageSmoothingEnabled=true;
 x.fillStyle='#000';x.textBaseline='top';x.font='bold '+10*S+'px Arial,sans-serif';x.fillText('Раскрась: '+t.n,40*S,6*S);
 x.font=4.5*S+'px Arial,sans-serif';x.fillText(t.k+' · не закрывай QR-код в углу листа',40*S,19*S);
 x.textAlign='right';x.fillText('Раскрась и покажи листок камере',277*S,26*S);
 const im=await loadImg(t.img),bw=277*S,bh=153*S,sc=Math.min(bw/im.width,bh/im.height)*.94,w=im.width*sc,h=im.height*sc;
 x.drawImage(im,(bw-w)/2,36*S+(bh-h)/2,w,h);return c}

function tryScan(src){

 const cp=document.createElement('canvas');cp.width=src.width;cp.height=src.height;cp.getContext('2d').drawImage(src,0,0);
 stopCam();closeM();toast('⏳ Оживляю…',1500);
 extract(cp,q.location,type).then(spr=>{if(!spr){toast('Не удалось вырезать рисунок — сфотографируйте лист целиком и ровнее');return}addItem(type,spr);toast('✨ '+T[type].n+' ожил(а)!')}).catch(()=>toast('Ошибка обработки рисунка'));
 return true}
function extract(src,L,type){
 const k=3,o=document.createElement('canvas');o.width=277*k;o.height=153*k;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);
 const TL=L.topLeftCorner,ux=(L.topRightCorner.x-TL.x)/24,uy=(L.topRightCorner.y-TL.y)/24,vx=(L.bottomLeftCorner.x-TL.x)/24,vy=(L.bottomLeftCorner.y-TL.y)/24,det=ux*vy-uy*vx;
 if(!det)return Promise.resolve(null);const i00=vy/det,i01=-vx/det,i10=-uy/det,i11=ux/det;
 x.setTransform(k*i00,k*i10,k*i01,k*i11,k*(-i00*TL.x-i01*TL.y+6),k*(-i10*TL.x-i11*TL.y-30));
 x.drawImage(src,0,0);x.setTransform(1,0,0,1,0,0);
 return getMask(type).then(m=>applyMask(o,m))}
/* силуэт рисунка берём из самого шаблона — фон бумаги определять не нужно */
function morph(a,w,h,r,dil){const o=new Uint8Array(w*h),t=new Uint8Array(w*h),pre=new Int32Array(Math.max(w,h)+1),L=2*r+1;
 for(let y=0;y<h;y++){pre[0]=0;for(let x=0;x<w;x++)pre[x+1]=pre[x]+a[y*w+x];for(let x=0;x<w;x++){const lo=Math.max(0,x-r),hi=Math.min(w,x+r+1),c=pre[hi]-pre[lo];t[y*w+x]=dil?(c>0?1:0):((x-r>=0&&x+r<w&&c==L)?1:0)}}
 for(let x=0;x<w;x++){pre[0]=0;for(let y=0;y<h;y++)pre[y+1]=pre[y]+t[y*w+x];for(let y=0;y<h;y++){const lo=Math.max(0,y-r),hi=Math.min(h,y+r+1),c=pre[hi]-pre[lo];o[y*w+x]=dil?(c>0?1:0):((y-r>=0&&y+r<h&&c==L)?1:0)}}
 return o}
const maskCache={};
async function getMask(type){if(maskCache[type])return maskCache[type];
 const w=277*3,h=153*3,N=w*h,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
 const im=await loadImg(T[type].img),sc=Math.min(w/im.width,h/im.height)*.94,dw=im.width*sc,dh=im.height*sc;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);
 const p=x.getImageData(0,0,w,h).data;let a=new Uint8Array(N);for(let n=0;n<N;n++)a[n]=(.3*p[n*4]+.59*p[n*4+1]+.11*p[n*4+2])<200?1:0;
 const r=4;a=morph(a,w,h,r,1);
 const ext=new Uint8Array(N),st=new Int32Array(N);let sp=0;const push=n=>{if(!ext[n]&&!a[n]){ext[n]=1;st[sp++]=n}};
 for(let i=0;i<w;i++){push(i);push((h-1)*w+i)}for(let j=0;j<h;j++){push(j*w);push(j*w+w-1)}
 while(sp){const n=st[--sp],cx=n%w,cy=(n/w)|0;if(cx>0)push(n-1);if(cx<w-1)push(n+1);if(cy>0)push(n-w);if(cy<h-1)push(n+w)}
 let m=new Uint8Array(N);for(let n=0;n<N;n++)m[n]=ext[n]?0:1;
 return maskCache[type]=morph(morph(m,w,h,r,0),w,h,2,1)}
function applyMask(o,m){
 const w=o.width,h=o.height,x=o.getContext('2d'),d=x.getImageData(0,0,w,h),p=d.data,hist=new Int32Array(256);let x0=w,x1=0,y0=h,y1=0,cntm=0;
 for(let n=0;n<w*h;n++)if(m[n]){hist[Math.min(255,.3*p[n*4]+.59*p[n*4+1]+.11*p[n*4+2]|0)]++;cntm++}
 if(cntm<2000)return null;
 let acc=0,p95=255;for(let v=0;v<256;v++){acc+=hist[v];if(acc>=cntm*.95){p95=v;break}}
 const gain=Math.min(1.5,250/Math.max(p95,110));
 for(let n=0;n<w*h;n++){if(m[n]){p[n*4]=Math.min(255,p[n*4]*gain);p[n*4+1]=Math.min(255,p[n*4+1]*gain);p[n*4+2]=Math.min(255,p[n*4+2]*gain);const X=n%w,Y=(n/w)|0;if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}else p[n*4+3]=0}
 x.putImageData(d,0,0);
 const bw=x1-x0+1,bh=y1-y0+1,s=Math.min(1,420/Math.max(bw,bh)),r=document.createElement('canvas');r.width=Math.round(bw*s);r.height=Math.round(bh*s);
 r.getContext('2d').drawImage(o,x0,y0,bw,bh,0,0,r.width,r.height);return r}
